name: Build & Release Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Optional custom release tag (e.g. v1.1.0). Leave empty for auto-increment patch'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Calculate Next Version Tag
        run: |
          if [ -n "${{ github.event.inputs.custom_tag }}" ]; then
            NEW_TAG="${{ github.event.inputs.custom_tag }}"
            NEW_VERSION="${NEW_TAG#v}"
          else
            LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n1)
            if [ -z "$LATEST_TAG" ]; then
              NEW_VERSION="1.0.0"
              NEW_TAG="v1.0.0"
            else
              RAW_VER="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VER"
              PATCH=$((PATCH + 1))
              NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
              NEW_TAG="v${NEW_VERSION}"
            fi
          fi
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "New version: $NEW_TAG"

      - name: Make Gradle Wrapper Executable
        run: chmod +x mobile/android/gradlew || true

      - name: Install Flutter Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release --build-name=${{ env.NEW_VERSION }} > flutter_build.log 2>&1 || (cat flutter_build.log && exit 1)

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter_build_error_log
          path: mobile/flutter_build.log

      - name: Create Git Tag & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ env.NEW_TAG }}" -m "Automated Release ${{ env.NEW_TAG }}" || true
          git push origin "${{ env.NEW_TAG }}" || true

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
