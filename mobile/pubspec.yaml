name: libravault_mobile
description: "LibraVault Mobile Application with GitHub OTA In-App Auto Update feature"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.2.4
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.3
  open_filex: ^4.5.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
